<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | X Fragil</title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="../home/style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="dashboard">
      <aside class="sidebar">
        <h1>X Fragil</h1>
        <nav aria-label="Menu principal">
          <a href="../dashboard/dashboard.html" aria-current="page">Dashboard</a>
          <a href="../pacientes/pacientes.html">Pacientes</a>
          <a href="../avaliacoes/avaliacoes.html">Avaliações</a>
          <a href="../home/home.html">Relatórios</a>
        </nav>
        <a class="logout" href="#">Sair</a>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <h2>Dashboard</h2>
            <p>Resumo geral dos seus pacientes e avaliações</p>
          </div>
          <p id="nome-usuario"></p>
        </header>

        <section class="cards">
          <div class="card-numero">
            <span>Pacientes</span>
            <strong id="total-pacientes">—</strong>
          </div>
          <div class="card-numero">
            <span>Avaliações</span>
            <strong id="total-avaliacoes">—</strong>
          </div>
          <div class="card-numero">
            <span>Avaliações neste mês</span>
            <strong id="avaliacoes-mes">—</strong>
          </div>
          <div class="card-numero">
            <span>Score médio</span>
            <strong id="score-medio">—</strong>
          </div>
        </section>

        <section class="report-card">
          <h3>Últimas avaliações</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Paciente</th>
                  <th>Data</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody id="ultimas-body">
                <tr>
                  <td colspan="3">Carregando...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="../js/session.js"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
