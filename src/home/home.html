<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios | X Fragil</title>
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="dashboard">
      <aside class="sidebar">
        <h1>X Fragil</h1>
        <nav aria-label="Menu principal">
          <a href="#" class="wip" aria-disabled="true" tabindex="-1">Dashboard <span class="wip-tag">wip</span></a>
          <a href="../pacientes/pacientes.html">Pacientes</a>
          <a href="#" class="wip" aria-disabled="true" tabindex="-1">Avaliações <span class="wip-tag">wip</span></a>
          <a href="../home/home.html" aria-current="page">Relatórios</a>
        </nav>
        <a class="logout" href="#" onclick="limparSessao(event)">Sair</a>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <h2>Relatórios</h2>
            <p>Consulte e acompanhamento das avaliações</p>
          </div>
          <p id="nome-usuario"></p>
          <!-- wip -->
        </header>

        <section class="report-card">
          <h3>Filtros de pesquisa</h3>
          <form class="filters">
            <label
              >Data inicial<input type="text" placeholder="DD/MM/AAAA"
            /></label>
            <label
              >Data final<input type="text" placeholder="DD/MM/AAAA"
            /></label>
            <label
              >Usuário<select>
                <option selected disabled>Selecionar</option>
              </select></label
            >
            <div class="filter-actions">
              <button class="button-secondary" type="reset">
                Limpar filtros
              </button>
              <button class="button-primary" type="button">Filtrar</button>
            </div>
          </form>

          <h3>Avaliações encontradas</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Selecionar</th>
                  <th>Paciente</th>
                  <th>Data</th>
                  <th>Score</th>
                  <th>Resultado</th>
                </tr>
              </thead>
              <tbody id="avaliacoes-body">
                <tr>
                  <td colspan="5">Carregando avaliações...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="report-actions">
            <button
              id="exportar-pdf"
              class="button-secondary"
              type="button"
              onClick="exportToPDF()"
            >
              Exportar PDF
            </button>
            <button class="button-primary" type="button">
              Imprimir relatório
            </button>
          </div>
        </section>
      </section>
    </main>
    <script src="../js/session.js"></script>
    <script src="../node_modules/jspdf/dist/jspdf.umd.min.js"></script>
    <script src="../js/pdf-export.js"></script>
    <script src="home.js"></script>
  </body>
</html>
